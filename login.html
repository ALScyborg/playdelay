<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1628" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="description" content="Sign in or create a PlayDelay account." />
  <link rel="stylesheet" href="styles.css" />
  <title>Sign in — PlayDelay</title>
</head>
<body class="landing env-landing login-page">
  <div class="landing-shell login-shell">
    <header class="landing-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">PD</span>
        <div class="brand-text">
          <h1>PlayDelay</h1>
          <p class="subtitle">Account required</p>
        </div>
      </div>
    </header>

    <main>
      <section class="login-card" aria-labelledby="login-title">
        <div class="auth-tabs" role="tablist" aria-label="Sign in or sign up">
          <button type="button" class="auth-tab is-active" id="tabSignIn" role="tab" aria-selected="true">
            Sign in
          </button>
          <button type="button" class="auth-tab" id="tabSignUp" role="tab" aria-selected="false">
            Sign up
          </button>
        </div>

        <h2 id="login-title" class="section-title">Sign in</h2>
        <p class="login-demo-note" id="authNote">
          Use your email and password to open the player. Free while we test.
        </p>

        <form id="authForm" class="login-form" novalidate>
          <label class="field">
            <span class="field-label">Email</span>
            <input
              id="email"
              class="field-input"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              required
              placeholder="you@example.com"
            />
          </label>

          <label class="field">
            <span class="field-label">Password</span>
            <input
              id="password"
              class="field-input"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="6"
              placeholder="At least 6 characters"
            />
          </label>

          <p id="loginError" class="login-error" role="alert" hidden></p>
          <p id="loginInfo" class="login-info" role="status" hidden></p>

          <div class="login-actions">
            <button type="submit" class="btn btn-cta" id="submitBtn">
              Sign in
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="landing-footer">
      <p><a href="index.html">Back to home</a></p>
    </footer>
  </div>

  <script src="auth-app.js"></script>
</body>
</html>
