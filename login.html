<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1628" />
  <meta name="description" content="PlayDelay demo sign-in — optional, does not block the player." />
  <link rel="stylesheet" href="styles.css" />
  <title>Sign in — PlayDelay</title>
</head>
<body class="landing">
  <div class="landing-shell login-shell">
    <header class="landing-header">
      <div class="brand">
        <a class="brand-mark brand-mark-link" href="index.html" aria-label="PlayDelay home">PD</a>
        <div class="brand-text">
          <h1>Sign in</h1>
          <p class="subtitle">Optional · demo accounts only</p>
        </div>
      </div>
      <a class="nav-link" href="player.html">Open player</a>
    </header>

    <main>
      <section class="login-card" aria-labelledby="login-title">
        <h2 id="login-title" class="section-title">Continue with email</h2>
        <p class="login-demo-note">
          Demo-only auth stored in this browser (password hashed in localStorage).
          Not for real credentials — future: Firebase / Supabase. Player works signed out.
        </p>

        <form id="loginForm" class="login-form" novalidate>
          <label class="field-label" for="email">Email</label>
          <input
            class="field-input"
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            required
            placeholder="you@example.com"
          />

          <label class="field-label" for="password">Password</label>
          <input
            class="field-input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            minlength="6"
            placeholder="At least 6 characters"
          />

          <p id="loginError" class="login-error" role="alert" hidden></p>

          <div class="login-actions">
            <button type="submit" class="btn btn-cta" id="signInBtn" data-mode="signin">
              Sign in
            </button>
            <button type="button" class="btn btn-auth-secondary" id="createBtn">
              Create account
            </button>
          </div>
        </form>

        <p class="hero-note login-back">
          <a href="player.html">Skip — use player without signing in</a>
        </p>
      </section>
    </main>
  </div>

  <script src="auth.js"></script>
  <script>
    (() => {
      "use strict";
      const params = new URLSearchParams(location.search);
      const nextRaw = params.get("next") || "player.html";
      const next =
        nextRaw === "login.html" || nextRaw.includes("://")
          ? "player.html"
          : nextRaw;

      const form = document.getElementById("loginForm");
      const errEl = document.getElementById("loginError");
      const createBtn = document.getElementById("createBtn");
      let mode = "signin";

      if (window.PlayDelayAuth.getSession()) {
        location.replace(next);
        return;
      }

      function showError(msg) {
        errEl.hidden = !msg;
        errEl.textContent = msg || "";
      }

      createBtn.addEventListener("click", async () => {
        mode = "create";
        showError("");
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        try {
          await window.PlayDelayAuth.createAccount(email, password);
          location.replace(next);
        } catch (e) {
          showError(e.message || "Could not create account.");
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        mode = "signin";
        showError("");
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        try {
          await window.PlayDelayAuth.signIn(email, password);
          location.replace(next);
        } catch (e) {
          showError(e.message || "Could not sign in.");
        }
      });
    })();
  </script>
</body>
</html>
