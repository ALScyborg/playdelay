<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1628" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BYU Radio" />
  <meta name="description" content="PlayDelay BYU — sync KSL NewsRadio to your TV. Sign in, then Play. Free while we test." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>BYU Radio — PlayDelay</title>
</head>
<body>
  <div class="app player-app">
    <div class="player-accent" aria-hidden="true">
      <img src="assets/player-accent.svg" alt="" width="520" height="200" />
    </div>

    <header class="header">
      <div class="brand">
        <a class="brand-mark brand-mark-link" href="index.html" aria-label="PlayDelay home">BYU</a>
        <div class="brand-text">
          <h1>KSL NewsRadio</h1>
          <p class="subtitle">PlayDelay · radio ↔ TV sync</p>
        </div>
      </div>
      <div class="header-end">
        <div class="session-chip" id="sessionChip" hidden>
          <span id="sessionEmail" class="session-email"></span>
          <button type="button" class="btn btn-auth" id="signOutBtn">Sign out</button>
        </div>
        <div id="statusChip" class="status-chip status-idle" role="status" aria-live="polite">Idle</div>
      </div>
    </header>

    <div id="banner" class="banner" hidden role="alert" aria-live="assertive"></div>
    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <main class="main">
      <section class="delay-readout" aria-label="Current delay">
        <div id="delayValue" class="delay-value">Live</div>
        <div class="delay-label">Audio delay</div>
      </section>

      <section class="transport" aria-label="Playback">
        <button type="button" id="playBtn" class="btn btn-play" aria-pressed="false">
          Play
        </button>
        <button type="button" id="muteBtn" class="btn btn-mute" aria-pressed="false">
          Mute
        </button>
      </section>

      <section class="volume-row" aria-label="Volume">
        <label for="volume" class="volume-label">Volume</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
      </section>

      <section class="presets" aria-label="Delay presets">
        <button type="button" class="btn btn-preset" data-delay="0">Live</button>
        <button type="button" class="btn btn-preset" data-delay="5">5s</button>
        <button type="button" class="btn btn-preset" data-delay="8">8s</button>
        <button type="button" class="btn btn-preset" data-delay="10">10s</button>
        <button type="button" class="btn btn-preset" data-delay="15">15s</button>
      </section>

      <section class="steps" aria-label="Adjust delay">
        <button type="button" class="btn btn-step" data-delta="-10">−10s</button>
        <button type="button" class="btn btn-step" data-delta="-1">−1s</button>
        <button type="button" class="btn btn-step" data-delta="1">+1s</button>
        <button type="button" class="btn btn-step" data-delta="10">+10s</button>
      </section>

      <p class="sync-tip">
        Hear play before you see it → add delay.
        See before you hear → delay the TV.
      </p>

      <p class="shortcuts">
        Shortcuts: Space play/pause · M mute · ↑/↓ ±1s
      </p>
    </main>

    <!-- Hidden audio element; MediaElementSource when delay engine works -->
    <audio id="audio" preload="none" playsinline></audio>
  </div>
  <script src="player-boot.js"></script>
</body>
</html>
