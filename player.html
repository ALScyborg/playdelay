<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1628" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PlayDelay" />
  <title>PlayDelay Player — Radio delay sync for Big 12, Miami &amp; USC</title>
  <meta name="description" content="Open the PlayDelay player: pick any Big 12, Miami, or USC team, play live radio when available, and dial audio delay until the call matches your TV." />
  <link rel="canonical" href="https://playdelay.app/player.html" />
  <meta property="og:title" content="PlayDelay Player — Radio delay sync" />
  <meta property="og:description" content="Pick a Big 12 / Miami / USC team, play live radio when available, and dial delay until the call matches your TV." />
  <meta property="og:url" content="https://playdelay.app/player.html" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://playdelay.app/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PlayDelay Player — Radio delay sync" />
  <meta name="twitter:description" content="Pick a Big 12 / Miami / USC team, play live radio when available, and dial delay until the call matches your TV." />
  <meta name="twitter:image" content="https://playdelay.app/assets/og-image.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=helpmin2" />
</head>
<body>
  <div class="app player-app">
    <div class="player-accent" aria-hidden="true">
      <img src="assets/player-accent.svg" alt="" width="520" height="200" />
    </div>

    <header class="header">
      <div class="brand">
        <a class="brand-mark brand-mark-link" href="index.html" id="brandMark" aria-label="PlayDelay home">BYU</a>
        <div class="brand-text">
          <h1 id="stationTitle">KSL NewsRadio</h1>
          <p class="subtitle">PlayDelay · radio ↔ TV sync</p>
        </div>
      </div>
      <div class="header-end">
        <a class="nav-link player-pricing-link" href="pricing.html">Pricing</a>
        <a class="credits-chip" id="creditsChip" href="pricing.html" hidden aria-live="polite">Credits</a>
        <div class="session-chip" id="sessionChip" hidden>
          <span id="sessionEmail" class="session-email"></span>
          <button type="button" class="btn btn-auth" id="signOutBtn">Sign out</button>
        </div>
        <div id="statusChip" class="status-chip status-idle" role="status" aria-live="polite">Idle</div>
      </div>
    </header>

    <div id="banner" class="banner" hidden role="alert" aria-live="assertive"></div>
    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <main class="main">
      <section
        class="team-picker"
        id="teamToggle"
        role="group"
        aria-label="Team"
        data-active="byu"
      >
        <!-- Filled by app.js from teams.js -->
      </section>

      <section class="delay-readout" aria-label="Current delay">
        <div id="delayValue" class="delay-value">Live</div>
        <div class="delay-label">Audio delay</div>
      </section>

      <section class="transport" aria-label="Playback">
        <button type="button" id="playBtn" class="btn btn-play" aria-pressed="false">
          Play
        </button>
        <button type="button" id="muteBtn" class="btn btn-mute" aria-pressed="false">
          Mute
        </button>
      </section>

      <section class="volume-row" aria-label="Volume">
        <label for="volume" class="volume-label">Volume</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
      </section>

      <section class="presets" aria-label="Delay presets">
        <button type="button" class="btn btn-preset" data-delay="0">Live</button>
        <button type="button" class="btn btn-preset" data-delay="5">5s</button>
        <button type="button" class="btn btn-preset" data-delay="8">8s</button>
        <button type="button" class="btn btn-preset" data-delay="10">10s</button>
        <button type="button" class="btn btn-preset" data-delay="15">15s</button>
      </section>

      <section class="steps" aria-label="Adjust delay">
        <button type="button" class="btn btn-step" data-delta="-10">−10s</button>
        <button type="button" class="btn btn-step" data-delta="-1">−1s</button>
        <button type="button" class="btn btn-step" data-delta="1">+1s</button>
        <button type="button" class="btn btn-step" data-delta="10">+10s</button>
      </section>


      <section class="schedule-panel" id="schedulePanel" aria-label="Team schedule">
        <div id="sportToggle" class="sport-toggle" role="group" aria-label="Sport" data-active="football"></div>
        <div class="schedule-panel-head">
          <h2 id="scheduleTitle" class="sched-panel-title">BYU football schedule</h2>
          <p id="scheduleAttr" class="sched-attr">
            Schedule via <a href="https://www.espn.com/college-football/team/schedule/_/id/252" target="_blank" rel="noopener noreferrer">ESPN</a>
          </p>
        </div>
        <div id="scheduleSportNoteHost"></div>
        <div id="scheduleStatus" class="sched-status" hidden></div>
        <div id="scheduleUpcoming"></div>
        <div id="scheduleRecent"></div>
      </section>

      <p class="sync-tip">
        Hear play before you see it → add delay.
        See before you hear → delay the TV.
      </p>

      <p class="shortcuts">
        Shortcuts: Space play/pause · M mute · ↑/↓ ±1s
      </p>
    </main>

    <!-- Hidden audio element; MediaElementSource when delay engine works -->
    <audio id="audio" preload="none" playsinline></audio>
  </div>
  <script src="teams.js"></script>
  <script src="usage.js"></script>
  <script src="schedule.js"></script>
  <script src="player-boot.js"></script>
  <script src="support-chat.js?v=helpmin2"></script>
</body>
</html>
